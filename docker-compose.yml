services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vortemis
      POSTGRES_PASSWORD: vortemis
      POSTGRES_DB: vortemis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortemis -d vortemis"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed_and_ingest:
    build: .
    command: sh -c "python scripts/seed_and_generate.py --generate-sample && python -m vortemis.entrypoints.cli"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vortemis:vortemis@db:5432/vortemis
      LOG_FILE: /app/data/samples/conn_massive.log
      MODEL_PATH: /app/models/vortemis_ae.pt
      CONTINUOUS_MODE: "true"
      VORTEMIS_ADMIN_USERNAME: ${VORTEMIS_ADMIN_USERNAME:-admin_carles}
      VORTEMIS_ADMIN_PASSWORD: ${VORTEMIS_ADMIN_PASSWORD:-VortemisAdmin2026!}
      VORTEMIS_ANALYST_USERNAME: ${VORTEMIS_ANALYST_USERNAME:-soc_analyst}
      VORTEMIS_ANALYST_PASSWORD: ${VORTEMIS_ANALYST_PASSWORD:-VortemisAnalyst2026!}
    volumes:
      - ./data/samples:/app/data/samples

  dashboard:
    build: .
    command: streamlit run src/vortemis/entrypoints/dashboard.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vortemis:vortemis@db:5432/vortemis
      LOG_FILE: /app/data/samples/conn_massive.log
      MODEL_PATH: /app/models/vortemis_ae.pt
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./data/samples:/app/data/samples

  api:
    build: .
    command: sh -c "alembic upgrade head || alembic stamp head; uvicorn vortemis.entrypoints.api:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://vortemis:vortemis@db:5432/vortemis
      MODEL_PATH: /app/models/vortemis_ae.pt
      LOG_FILE: /app/data/samples/conn_massive.log
      HEALTHCHECK_URL: http://127.0.0.1:8000/v1/health
      VORTEMIS_CORS_ORIGINS: ${VORTEMIS_CORS_ORIGINS:-http://localhost:3000}
      VORTEMIS_ACCESS_TTL_MINUTES: ${VORTEMIS_ACCESS_TTL_MINUTES:-15}
      VORTEMIS_REFRESH_TTL_DAYS: ${VORTEMIS_REFRESH_TTL_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./data/samples:/app/data/samples

volumes:
  postgres_data:
