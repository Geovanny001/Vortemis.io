name: OpenAPI release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py

      - name: Attach the contract to the release
        run: gh release upload "${{ github.event.release.tag_name }}" docs/openapi.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
